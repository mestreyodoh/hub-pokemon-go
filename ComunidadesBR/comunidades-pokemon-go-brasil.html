<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comunidades Oficiais Pokémon GO - Brasil</title>
<link rel="icon" href="/assets/PERFIL_BALL_OK.png" type="image/png"/>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f0f0f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center}
.spinner{width:36px;height:36px;border:3px solid #2a2e38;border-top-color:#ff5a36;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spinner"></div><p>Carregando comunidades…</p></div>
<script>
(async function () {
  try {
    const parts = await Promise.all([
      fetch("/ComunidadesBR/page.b64.1").then(function(r){return r.text();}),
      fetch("/ComunidadesBR/page.b64.2").then(function(r){return r.text();}),
      fetch("/ComunidadesBR/page.b64.3").then(function(r){return r.text();}),
      fetch("/ComunidadesBR/page.b64.4").then(function(r){return r.text();})
    ]);
    const b64 = parts.join("").replace(/\s+/g, "");
    const bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    const ds = new DecompressionStream("gzip");
    const stream = new Response(bin).body.pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = "<p style=\"padding:2rem;text-align:center\">Erro ao carregar. Atualize a página.</p>";
    console.error(e);
  }
})();
</script>
</body>
</html>
